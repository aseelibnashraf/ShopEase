server {
    listen 80;
    server_name shop.vybops.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name shop.vybops.com;

    ssl_certificate     /etc/letsencrypt/live/shop.vybops.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.vybops.com/privkey.pem;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
