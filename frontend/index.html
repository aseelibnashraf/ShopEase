<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header></header>

  <main>
    <h1>Products</h1>
    <section id="products" class="grid"><p>Loading products…</p></section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="common.js"></script>
  <script>
    renderHeader();

    async function loadProducts() {
      const box = document.getElementById("products");
      try {
        const res = await fetch(`${API}/products`);
        const products = await res.json();

        box.innerHTML = products.map(p => `
          <div class="card">
            <a href="product.html?id=${p.id}">
              <img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}">
            </a>
            <h3><a href="product.html?id=${p.id}">${escapeHtml(p.name)}</a></h3>
            <p class="price">${rupees(p.price)}</p>
            <button data-id="${p.id}">Add to cart</button>
          </div>`).join("");

        box.querySelectorAll("button").forEach(btn => {
          btn.onclick = () => {
            addToCart(products.find(p => p.id == btn.dataset.id));
            showToast("Added to cart");
          };
        });
      } catch (err) {
        box.innerHTML = "<p class='error'>Could not load products. Is the backend running?</p>";
      }
    }

    loadProducts();
  </script>
</body>
</html>
